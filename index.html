<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>test</title>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <!--   전체 레이아웃 -->
        <div class="wrap">
            <!-- 상단 -->
            <header class="header">
                <div class="inner">
                    <!-- header-top -->
                    <div class="header-top">
                        <ul class="util">
                            <li><a href="#">Contact</a></li>
                            <li><a href="#">Help</a></li>
                            <li><a href="#">Login</a></li>
                            <li><a href="#">Join</a></li>
                            <li><a href="#">Sitemap</a></li>
                        </ul>
                    </div>
                    <!-- header-bt -->
                    <div class="header-bt">
                        <!-- logo -->
                        <h1><a href="#">GREEN-A</a></h1>
                        <!-- menu -->
                        <ul class="gnb">
                            <li><a href="#">DEPARTMENT</a></li>
                            <li><a href="#">GALLERY</a></li>
                            <li><a href="#">YOUTUBE</a></li>
                            <li><a href="#">COMMUNITY</a></li>
                            <li><a href="#">LOCATION</a></li>
                        </ul>
                    </div>
                </div>
            </header>
            <!-- 비주얼 -->
            <!-- figure :독립적인 콘텐츠 담는데 사용하는 태그 -->
            <figure>
                <!-- 비디오 -->
                <video autoplay muted id="videoPlayer">
                    <source src="images/video1.mp4" type="video/mp4" />
                </video>
                <!-- 비디오 내용 -->
                <div class="video-txt inner">
                    <h2>Animation & Motion graphics</h2>
                    <p>Hello! Introduce My Video</p>
                    <a href="#">view detail</a>
                </div>
            </figure>
            <!-- 뉴스 -->
            <!-- 작품 -->
            <!-- 하단 -->
        </div>
        <script>
            const videos = ["images/video1.mp4", "images/video2.mp4", "images/video3.mp4"]; // 재생할 영상 목록
            let currentVideoIndex = 0;
            const player = document.getElementById("videoPlayer");

            player.onended = function () {
                currentVideoIndex++;
                if (currentVideoIndex < videos.length) {
                    player.src = videos[currentVideoIndex]; // 다음 영상 소스 교체
                    player.play(); // 재생
                }
            };
        </script>
    </body>
</html>
